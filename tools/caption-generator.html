<script>
let selectedCat = 'all';
let currentItem = null;
let lastIndex = -1;

const els = {
  cats: document.getElementById('cats'),
  generateBtn: document.getElementById('generateBtn'),
  copyBtn: document.getElementById('copyBtn'),
  shareBtn: document.getElementById('shareBtn'),
  captionText: document.getElementById('captionText'),
  hashtagsList: document.getElementById('hashtagsList'),
  resultCategory: document.getElementById('resultCategory'),
  toast: document.getElementById('toast')
};

// Category selection
els.cats.addEventListener('click', (e) => {
  const btn = e.target.closest('.cat-pill');
  if (!btn) return;
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedCat = btn.dataset.cat;
  generate();
});

// Generate
els.generateBtn.addEventListener('click', generate);

function generate() {
  if (typeof CAPTIONS === 'undefined') {
    els.captionText.textContent = 'Oops! Refresh karo';
    return;
  }
  
  const pool = selectedCat === 'all' 
    ? CAPTIONS 
    : CAPTIONS.filter(c => c.category === selectedCat);
  
  if (pool.length === 0) {
    els.captionText.textContent = 'Is category me captions nahi mile';
    els.hashtagsList.innerHTML = '';
    return;
  }
  
  // Random avoiding repeat
  let i;
  do {
    i = Math.floor(Math.random() * pool.length);
  } while (pool.length > 1 && i === lastIndex);
  lastIndex = i;
  
  currentItem = pool[i];
  
  // Render
  els.captionText.textContent = currentItem.text;
  els.resultCategory.textContent = currentItem.category;
  
  // Hashtags as pills
  const tags = currentItem.tags.split(' ').filter(t => t.startsWith('#'));
  els.hashtagsList.innerHTML = tags.map(t => `<span class="hashtag">${t}</span>`).join('');
  
  // Reset copy button
  els.copyBtn.classList.remove('success');
  els.copyBtn.querySelector('span:last-child').textContent = 'Copy';
}

// Copy
els.copyBtn.addEventListener('click', () => {
  if (!currentItem) return;
  const fullText = currentItem.text + '\n\n' + currentItem.tags;
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(fullText)
      .then(() => copySuccess())
      .catch(() => fallbackCopy(fullText));
  } else {
    fallbackCopy(fullText);
  }
});

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    copySuccess();
  } catch(e) {
    showToast('Copy fail');
  }
  document.body.removeChild(ta);
}

function copySuccess() {
  els.copyBtn.classList.add('success');
  els.copyBtn.querySelector('span:last-child').textContent = 'Copied!';
  showToast('Caption copied with hashtags');
  setTimeout(() => {
    els.copyBtn.classList.remove('success');
    els.copyBtn.querySelector('span:last-child').textContent = 'Copy';
  }, 2000);
}

// Share
els.shareBtn.addEventListener('click', () => {
  if (!currentItem) return;
  const text = currentItem.text + '\n\n' + currentItem.tags + '\n\nMore: https://captionstudio.in';
  
  if (navigator.share) {
    navigator.share({ text: text }).catch(() => {});
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }
});

function showToast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  setTimeout(() => els.toast.classList.remove('show'), 2000);
}

// Auto-generate on load
window.addEventListener('load', () => {
  setTimeout(generate, 200);
});
</script>
