name: Auto Blog System

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'   # 12 AM IST

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Run Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script.py

      - name: Commit & Push
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@site.com"
          git add .
          git commit -m "auto update" || echo "no changes"
          git push
