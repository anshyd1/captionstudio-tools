name: Auto Blog System

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Run Blog Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > script.py
          import requests, os, random, datetime

          # Load keywords
          with open('keywords.txt') as f:
              keywords = [k.strip() for k in f if k.strip()]

          keyword = random.choice(keywords)
          slug = keyword.replace(" ", "-")

          print("Generating:", keyword)

          try:
              res = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {os.environ.get('GROQ_API_KEY','')}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": "llama3-8b-8192",
                      "messages": [
                          {"role": "user", "content": f"""
Write a full SEO optimized HTML blog for: "{keyword}"

Include:
- <title>
- meta description
- H1
- intro paragraph
- 50 captions in <ul><li>
- FAQ section
- clean HTML only
"""}
                      ]
                  }
              ).json()

              content = res['choices'][0]['message']['content']

          except Exception as e:
              print("API FAIL:", e)
              content = f"<html><body><h1>{keyword}</h1><p>Content coming soon...</p></body></html>"

          os.makedirs("blog", exist_ok=True)

          filename = f"blog/{slug}.html"
          with open(filename, "w", encoding="utf-8") as f:
              f.write(content)

          print("Created:", filename)
          EOF

          python script.py

      - name: Commit & Push
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@site.com"

          git add .
          git commit -m "New blog generated" || echo "No changes"
          git push
