name: Auto SEO System

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Create script
        run: |
          cat << 'EOF' > script.py
          import requests, os, random, glob

          # Load keywords
          with open('keywords.txt') as f:
              keywords = [k.strip() for k in f if k.strip()]

          keyword = random.choice(keywords)
          slug = keyword.lower().replace(" ", "-")

          print("Keyword:", keyword)

          # API call
          try:
              res = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {os.environ.get('GROQ_API_KEY','')}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": "llama3-8b-8192",
                      "messages": [
                          {"role": "user", "content": f"""
Create a SEO optimized HTML page for "{keyword}"

Include:
- <title>
- meta description
- H1
- 50 captions in <ul><li>
- FAQ section
- clean HTML
"""}
                      ]
                  }
              ).json()

              content = res['choices'][0]['message']['content']

          except:
              content = f"<html><body><h1>{keyword}</h1></body></html>"

          # Save blog
          os.makedirs("blog", exist_ok=True)
          filepath = f"blog/{slug}.html"

          with open(filepath, "w", encoding="utf-8") as f:
              f.write(content)

          print("Created:", filepath)

          # 🔥 AUTO INDEX PAGE
          files = glob.glob("blog/*.html")
          links = [f'<li><a href="{f}">{f.split("/")[-1]}</a></li>' for f in files]

          index_html = f"""
          <html>
          <head><title>All Captions</title></head>
          <body>
          <h1>All Caption Pages</h1>
          <ul>
          {''.join(links)}
          </ul>
          </body>
          </html>
          """

          with open("index.html", "w") as f:
              f.write(index_html)

          # 🔥 AUTO SITEMAP
          urls = [f"https://anshyd1.github.io/captionstudio-tools/{f}" for f in files]

          sitemap = '<?xml version="1.0" encoding="UTF-8"?>'
          sitemap += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'

          for url in urls:
              sitemap += f"<url><loc>{url}</loc></url>"

          sitemap += '</urlset>'

          with open("sitemap.xml", "w") as f:
              f.write(sitemap)

          print("Index + Sitemap updated")
          EOF

      - name: Run script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script.py

      - name: Push changes
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@site.com"
          git add .
          git commit -m "Auto SEO update" || echo "No changes"
          git push
