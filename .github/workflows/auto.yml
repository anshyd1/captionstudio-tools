name: Auto SEO System

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 🔥 push ke liye required

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Create blog page
        run: |
          mkdir -p blog
          echo "<html><body><h1>System Working ✅</h1></body></html>" > blog/test.html

      - name: Commit & Push
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@site.com"

          git add .
          git commit -m "auto page" || echo "No changes"

          git push
