name: Daily Auto Blog 2026
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          pip install requests
          python -c "
          import requests, os, datetime
          res = requests.post('https://groq.com', 
              headers={'Authorization': f'Bearer {os.environ[\"GROQ_API_KEY\"]}'},
              json={'model': 'llama3-8b-8192', 'messages': [{'role': 'user', 'content': 'Write a 2000-word SEO blog in HTML format about Best Instagram Captions 2026.'}]}).json()
          content = res['choices']['message']['content']
          os.makedirs('blog', exist_ok=True)
          date_now = datetime.datetime.now().strftime('%Y-%m-%d-%H%M')
          with open(f'blog/post-{date_now}.html', 'w') as f: f.write(content)
          "
          git config --global user.name 'AutoBot'
          git config --global user.email 'bot@captionstudio.in'
          git add .
          git commit -m 'Auto blog post'
          git push https://x-access-token:${{ secrets.MY_GITHUB_TOKEN }}@://github.com{{ github.repository }} HEAD:main
