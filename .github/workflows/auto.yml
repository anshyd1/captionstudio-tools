name: Auto SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'   # 12 AM India

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Generate SEO Page
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install requests
          python - <<EOF
import requests, os, random

print("Starting script...")

# Load keywords safely
keywords = []
if os.path.exists('keywords.txt'):
    with open('keywords.txt') as f:
        keywords = [k.strip() for k in f if k.strip()]

if not keywords:
    keywords = ["instagram captions", "attitude captions"]

keyword = random.choice(keywords)
slug = keyword.lower().replace(" ", "-")

print("Keyword:", keyword)

# Try API
content = ""

try:
    res = requests.post(
        "https://api.groq.com/openai/v1/chat/completions",
        headers={
            "Authorization": f"Bearer {os.environ.get('GROQ_API_KEY','')}",
            "Content-Type": "application/json"
        },
        json={
            "model": "llama3-8b-8192",
            "messages": [
                {"role": "user", "content": f"""
Create a simple SEO HTML page for "{keyword}"

Include:
- title
- meta description
- h1
- 30 captions list
- basic HTML only
"""}
            ]
        },
        timeout=20
    )

    data = res.json()
    print("API response:", data)

    content = data['choices'][0]['message']['content']

except Exception as e:
    print("API FAILED:", e)
    content = f"""
<html>
<head><title>{keyword}</title></head>
<body>
<h1>{keyword}</h1>
<p>Auto generated fallback content</p>
</body>
</html>
"""

# Save file
os.makedirs('blog', exist_ok=True)
filename = f"blog/{slug}.html"

with open(filename, "w", encoding="utf-8") as f:
    f.write(content)

print("File created:", filename)
EOF

      - name: Commit & Push
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@site.com"
          git add .
          git commit -m "Auto SEO page" || echo "No changes to commit"
          git push
