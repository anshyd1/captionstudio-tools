name: Auto Blog Gemini

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Run Blog Script
        env:
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        run: |
          cat << 'EOF' > script.py
          import requests, os, random

          # 👉 keyword (later file se bhi le sakte ho)
          keyword = "instagram captions 2026"
          slug = keyword.replace(" ", "-")

          print("Generating:", keyword)

          # 🔥 keys load
          keys = [
              os.environ.get("GEMINI_API_KEY1"),
              os.environ.get("GEMINI_API_KEY2"),
              os.environ.get("GEMINI_API_KEY3")
          ]
          keys = [k for k in keys if k]

          content = None

          for key in keys:
              try:
                  print("Trying key...")

                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={key}"

                  payload = {
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": f"""
Write a full SEO optimized HTML blog for "{keyword}"

Include:
- <title>
- meta description
- H1
- intro paragraph
- 50 captions in <ul><li>
- FAQ section
- clean HTML only (no markdown)
"""
                                  }
                              ]
                          }
                      ]
                  }

                  res = requests.post(url, json=payload, timeout=20)

                  print("STATUS:", res.status_code)

                  data = res.json()

                  content = data['candidates'][0]['content']['parts'][0]['text']

                  if content:
                      print("SUCCESS")
                      break

              except Exception as e:
                  print("FAILED:", e)

          # fallback
          if not content:
              content = f"<html><body><h1>{keyword}</h1><p>API failed</p></body></html>"

          # save
          os.makedirs("blog", exist_ok=True)

          with open(f"blog/{slug}.html", "w", encoding="utf-8") as f:
              f.write(content)

          print("FILE CREATED")
          EOF

          python script.py

      - name: Commit & Push
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@site.com"

          git add .
          git commit -m "new blog" || echo "No changes"
          git push
