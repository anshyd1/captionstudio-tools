name: Auto Blog Working

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Run Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        run: |
          cat << 'EOF' > script.py
          import os

          print("=== START ===")

          # 🔍 check env
          print("GROQ:", bool(os.environ.get("GROQ_API_KEY")))
          print("GEMINI1:", bool(os.environ.get("GEMINI_API_KEY1")))

          keyword = "test captions"
          slug = keyword.replace(" ", "-")

          content = "<h1>Default</h1>"

          try:
              import requests

              print("Trying GROQ...")
              res = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": "Bearer " + os.environ.get("GROQ_API_KEY",""),
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": "llama3-8b-8192",
                      "messages": [
                          {"role": "user", "content": "Write HTML blog for " + keyword}
                      ]
                  },
                  timeout=15
              )

              print("STATUS:", res.status_code)
              print("RAW:", res.text[:200])

              data = res.json()
              content = data["choices"][0]["message"]["content"]

          except Exception as e:
              print("ERROR:", e)

          os.makedirs("blog", exist_ok=True)

          with open("blog/" + slug + ".html", "w") as f:
              f.write(content)

          print("FILE CREATED")
          print("=== END ===")
          EOF

          python script.py

      - name: Commit & Push
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@site.com"

          git add .
          git commit -m "debug run" || echo "No changes"
          git push || echo "Push failed but ignored"
