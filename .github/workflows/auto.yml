name: Auto SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'   # 12 AM India (UTC 18:30)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Generate SEO Page
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install requests
          python - <<EOF
import requests, os, random, datetime

# Load keywords
with open('keywords.txt', 'r') as f:
    keywords = [k.strip() for k in f if k.strip()]

keyword = random.choice(keywords)

slug = keyword.lower().replace(" ", "-")

prompt = f"""
Create a clean SEO HTML page for keyword: "{keyword}"

Include:
- <title>
- meta description
- H1 heading
- 50 captions (bullet list)
- FAQ section
- simple clean HTML
- internal link to /index.html

No markdown. Only HTML.
"""

res = requests.post(
    "https://api.groq.com/openai/v1/chat/completions",
    headers={
        "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
        "Content-Type": "application/json"
    },
    json={
        "model": "llama3-8b-8192",
        "messages": [{"role": "user", "content": prompt}]
    }
).json()

# Debug print
print(res)

content = res['choices'][0]['message']['content']

os.makedirs('blog', exist_ok=True)

filename = f"blog/{slug}.html"

with open(filename, "w", encoding="utf-8") as f:
    f.write(content)

print("Created:", filename)
EOF

      - name: Commit & Push
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@site.com"
          git add .
          git commit -m "New SEO page" || echo "No changes"
          git push
