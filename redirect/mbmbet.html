<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Redirecting… | CaptionStudio</title>

  <!-- GA4 tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X490RGQB38"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-X490RGQB38', { send_page_view: true });
  </script>

  <style>
    :root{--brand:#ff4d00;--bg:#fff7ed;--card:#fff;--line:#f3d4b8;--text:#121212;--muted:#666;--soft:#888}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
    .box{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 18px;box-shadow:0 18px 55px rgba(0,0,0,.10)}
    .badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fff3e8;color:#b33a00;font-size:12px;font-weight:900;margin-bottom:12px;border:1px solid #ffd3b6}
    h1{font-size:24px;line-height:1.15;margin:4px 0 10px;letter-spacing:-.3px}
    p{margin:0 auto 12px;max-width:350px;color:var(--muted);font-size:14px;line-height:1.55}
    .loader{width:42px;height:42px;margin:14px auto;border-radius:50%;border:4px solid #ffe0cc;border-top-color:var(--brand);animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn{display:inline-block;margin:8px 0 10px;padding:13px 21px;border-radius:999px;background:var(--brand);color:#fff;text-decoration:none;font-weight:950;box-shadow:0 10px 22px rgba(255,77,0,.25)}
    small{display:block;margin:8px auto 0;max-width:360px;color:var(--soft);font-size:11.5px;line-height:1.55}
    .src{margin-top:10px;color:#aaa;font-size:11px}
  </style>
</head>
<body>
  <main class="box" aria-label="18 plus gaming offer redirect">
    <div class="badge">18+ Sponsored Offer</div>
    <h1>Redirecting…</h1>
    <p>Gaming offer open ho raha hai. Agar auto-open na ho, button tap karo.</p>
    <div class="loader" aria-hidden="true"></div>
    <a id="goBtn" class="btn" href="https://www.mbmbet5.com/?code=UPHPMGKRSD3&t=1781762986" target="_blank" rel="sponsored nofollow noopener">Continue to Offer</a>
    <small>18+ only. Real-money gaming involves financial risk. No winning or income is guaranteed. Play responsibly. T&amp;C apply. This is a promotional/referral link.</small>
    <div class="src" id="srcText"></div>
  </main>

  <script>
    (function(){
      var target = 'https://www.mbmbet5.com/?code=UPHPMGKRSD3&t=1781762986';
      var params = new URLSearchParams(window.location.search);
      var src = (params.get('src') || 'unknown').replace(/[^a-z0-9_-]/gi, '').slice(0, 60) || 'unknown';
      var btn = document.getElementById('goBtn');
      var srcText = document.getElementById('srcText');
      var redirected = false;

      srcText.textContent = 'Source: ' + src;

      function sendEvent(name, callback){
        if (typeof gtag === 'function') {
          gtag('event', name, {
            event_category: 'affiliate',
            event_label: src,
            source_page: src,
            affiliate: 'mbmbet',
            transport_type: 'beacon',
            event_callback: callback,
            event_timeout: 900
          });
        } else if (callback) {
          callback();
        }
      }

      function redirectNow(){
        if (redirected) return;
        redirected = true;
        window.location.href = target;
      }

      btn.addEventListener('click', function(){
        sendEvent('mbmbet_manual_click');
      });

      // Track source, then redirect quickly. Keeps user experience almost like a direct link.
      setTimeout(function(){
        sendEvent('mbmbet_auto_redirect', redirectNow);
        setTimeout(redirectNow, 1100);
      }, 450);
    })();
  </script>
</body>
</html>
