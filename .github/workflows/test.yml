name: Auto SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests

      - name: Create script
        run: |
          cat << 'EOF' > script.py
          import requests, os, random

          with open('keywords.txt') as f:
              keywords = [k.strip() for k in f if k.strip()]

          keyword = random.choice(keywords)
          slug = keyword.lower().replace(" ", "-")

          print("Keyword:", keyword)

          try:
              res = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {os.environ.get('GROQ_API_KEY','')}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": "llama3-8b-8192",
                      "messages": [
                          {"role": "user", "content": f"Create HTML page for {keyword}"}
                      ]
                  }
              ).json()

              content = res['choices'][0]['message']['content']

          except:
              content = f"<html><body><h1>{keyword}</h1></body></html>"

          os.makedirs("blog", exist_ok=True)

          with open(f"blog/{slug}.html", "w") as f:
              f.write(content)

          print("Created:", slug)
          EOF

      - name: Run script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script.py

      - name: Push changes
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@site.com"
          git add .
          git commit -m "New blog page" || echo "No changes"
          git push
