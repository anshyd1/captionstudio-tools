const $=(id)=>document.getElementById(id);
let sel='all',cur=null,lastI=-1;

$('cats').addEventListener('click',(e)=>{
  const b=e.target.closest('.cat');
  if(!b)return;
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  sel=b.dataset.c;
  gen();
});

$('genBtn').addEventListener('click',gen);

function gen(){
  const pool=sel==='all'?C:C.filter(x=>x[1]===sel);
  if(pool.length===0){
    $('cText').textContent='Coming soon!';
    $('tList').innerHTML='';
    return;
  }
  let i;
  do{i=Math.floor(Math.random()*pool.length);}while(pool.length>1&&i===lastI);
  lastI=i;
  cur=pool[i];
  $('cText').textContent=cur[0];
  $('rCat').textContent='✨ '+cur[1];
  $('rNum').textContent=pool.length+' available';
  const tags=cur[2].split(' ').filter(t=>t.startsWith('#'));
  $('tList').innerHTML=tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  const cb=$('copyBtn');
  cb.classList.remove('done');
  cb.querySelector('span:last-child').textContent='Copy';
}

$('copyBtn').addEventListener('click',()=>{
  if(!cur)return;
  const t=cur[0]+'\n\n'+cur[2];
  copy(t,()=>{
    const b=$('copyBtn');
    b.classList.add('done');
    b.querySelector('span:last-child').textContent='Copied!';
    toast('Caption + hashtags copied!');
    setTimeout(()=>{
      b.classList.remove('done');
      b.querySelector('span:last-child').textContent='Copy';
    },2000);
  });
});

$('shareBtn').addEventListener('click',()=>{
  if(!cur)return;
  const t=cur[0]+'\n\n'+cur[2]+'\n\nMore: https://captionstudio.in';
  if(navigator.share){navigator.share({text:t}).catch(()=>{});}
  else{window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
});

function copy(t,cb){
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(cb).catch(fb);
  }else{fb();}
  function fb(){
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');cb();}catch(e){}
    document.body.removeChild(ta);
  }
}

function toast(m){
  const t=$('toast');
  t.textContent=m;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

window.addEventListener('load',()=>setTimeout(gen,200));
</script>
