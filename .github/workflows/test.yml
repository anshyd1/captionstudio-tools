name: Auto SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'   # 12 AM India

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Generate Page
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install requests
          python - <<EOF
import requests, os, random

# Load keywords
with open('keywords.txt') as f:
    keywords = [k.strip() for k in f if k.strip()]

keyword = random.choice(keywords)
slug = keyword.lower().replace(" ", "-")

print("Keyword:", keyword)

# API call
try:
    res = requests.post(
        "https://api.groq.com/openai/v1/chat/completions",
        headers={
            "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
            "Content-Type": "application/json"
        },
        json={
            "model": "llama3-8b-8192",
            "messages": [
                {"role": "user", "content": f"Create SEO HTML page for {keyword} with 50 captions"}
            ]
        }
    ).json()

    content = res['choices'][0]['message']['content']

except:
    content = f"<html><body><h1>{keyword}</h1></body></html>"

os.makedirs("blog", exist_ok=True)

with open(f"blog/{slug}.html", "w") as f:
    f.write(content)

print("Created:", slug)
EOF

      - name: Push changes
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@site.com"
          git add .
          git commit -m "New blog page" || echo "No changes"
          git push
